id = "waymap"
kind = "native-mod"
name = "Waymap"
summary = "Waypoints in the world and on the minimap, managed in-game with /wp."
description = """
Native waypoint mod for Horizon: 3D world markers projected from the camera,
colored dots on the minimap, a six-point HUD list and an edit panel (M). No
WebAssembly — pure Rust built into the game by the launcher.

- /wp add|del|list|rename|color|clear|edit|help
- Persistence in horizon-mods/.horizon-mod-data/waymap/waypoints.txt
- Options > Mods > Waymap

Known architecture limits: no fullscreen/inventory UI (HUD overlays only), no
tab completion for native commands, markers hidden while the chat screen is open.
"""
