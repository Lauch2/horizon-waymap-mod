id = "waymap"
kind = "native-mod"
name = "Waymap"
summary = "Waypoints in the world and on the minimap, managed in-game with /wp."
description = "Native waypoint mod for Horizon: 3D world markers projected from the camera,\ncolored dots on the minimap, a six-point HUD list and an edit panel (M). No\nWebAssembly — pure Rust, built into the game by the launcher.\n\n- /wp add|del|list|rename|color|clear|edit|help\n- Persistence in horizon-mods/.horizon-mod-data/waymap/waypoints.txt\n- Options > Mods > Waymap\n\nKnown implementation limits: the edit panel is a HUD overlay, the chat can cover\nHUD markers, and the minimap patch is pinned to its tested Horizon revision.\n"
authors = ["Lauch2"]
owners = ["Lauch2"]
key = "RWQy5wboGmp8e4yZJkKSwwuos+FUyHt948nJvU5GroOhUOMxj/8Qik2f"
license = "MIT"
